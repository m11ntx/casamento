  <!--
    IMPORTANTE: estas tags (title, description, Open Graph, Twitter Card) são
    o que aparece quando o link é compartilhado no WhatsApp/Facebook/Twitter/
    Slack etc. A maioria desses serviços NÃO executa JavaScript ao gerar a
    prévia — então, embora main.js também atualize título/descrição a partir
    de data/config.json em tempo de execução (para quem abre o site num
    navegador), isso não é visto por robôs de prévia. Ao personalizar o site,
    atualize também os valores estáticos abaixo para que correspondam ao que
    está em config.json.
  -->
